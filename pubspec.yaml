name: durvaeco
description: Durvaeco Enterprise Standalone Flutter Application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # HTTP Transport
  http: ^1.2.2

  # Hardware-backed Secure Storage
  flutter_secure_storage: ^9.2.2

  # Local Notifications & OS Alarms
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1

  # Telemetry & Observability
  sentry_flutter: ^9.27.0

  # Hardware Device & Permissions
  device_info_plus: ^12.4.0
  permission_handler: ^11.3.1

  # UI Utilities
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  path_provider_foundation: 2.4.1
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
